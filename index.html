<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Theme boot — apply the saved light/dark mode BEFORE first paint so the
         page never flashes the wrong palette. Mirrors src/hooks/useTheme.ts. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('vsr.theme');
          document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>

    <!-- Font-stack flag — pick v1 (current Cormorant/Plex) or v2 (candidate
         STIX Two Text + Geist) BEFORE first paint. Reversible + persistent:
         visit ?fontstack=v2 to switch, ?fontstack=v1 to revert (or clear the
         'vsr.fontstack' localStorage key). Preloads v2's critical weights only
         when v2 is active, so v1 pays no cost. -->
    <script>
      (function () {
        try {
          // ── DEFAULT_STACK — the single switch that decides what EVERYONE gets.
          //    'v1' = current Cormorant Garamond + IBM Plex Mono (today's live look)
          //    'v2' = STIX Two Text + Geist (the new stack)
          //    Flip this one string to 'v2' to ship the new stack site-wide;
          //    visitors can still opt out per-browser with ?fontstack=v1.
          var DEFAULT_STACK = 'v2';

          var qs = new URLSearchParams(location.search);
          var q = qs.get('fontstack');
          if (q === 'v1' || q === 'v2') localStorage.setItem('vsr.fontstack', q);
          // An explicit saved choice always wins; otherwise fall back to the default.
          var saved = localStorage.getItem('vsr.fontstack');
          var fs = saved === 'v1' || saved === 'v2' ? saved : DEFAULT_STACK;
          document.documentElement.setAttribute('data-fontstack', fs);
          if (fs === 'v2') {
            var crit = [
              '/fonts/stix-two-text-400.woff2',
              '/fonts/stix-two-text-500.woff2',
              '/fonts/geist-400.woff2',
              '/fonts/geist-500.woff2',
            ];
            for (var i = 0; i < crit.length; i++) {
              var l = document.createElement('link');
              l.rel = 'preload';
              l.as = 'font';
              l.type = 'font/woff2';
              l.href = crit[i];
              l.crossOrigin = 'anonymous';
              document.head.appendChild(l);
            }
          }
        } catch (e) {
          document.documentElement.setAttribute('data-fontstack', 'v1');
        }
      })();
    </script>

    <!-- Fonts — warm the connection early so Cormorant Garamond is ready
         for the first-paint brand loader wordmark (avoids a Times fallback
         flash that reads as less refined than the header). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
