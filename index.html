<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Fonts — warm the connection early so Cormorant Garamond is ready
         for the first-paint brand loader wordmark (avoids a Times fallback
         flash that reads as less refined than the header). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Primary -->
    <title>VS Research Labs — Research Peptides & Laboratory Supplies</title>
    <meta name="description" content="VS Research Labs — research-grade peptides, laboratory supplies, and precision instruments. Documented batch references, certificates of analysis, and inquiry-led procurement. For research use only." />
    <meta name="author" content="VS Research Labs" />
    <meta name="theme-color" content="#F4EFE6" />
    <link rel="canonical" href="https://vsresearchlabs.com/" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/brand/vs-dna-s-full-colour.svg" />
    <link rel="apple-touch-icon" href="/brand/vs-dna-s-full-colour.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="VS Research Labs" />
    <meta property="og:title" content="VS Research Labs — Research Peptides & Laboratory Supplies" />
    <meta property="og:description" content="Research-grade peptides, laboratory supplies, and precision instruments. Documented batch references and certificates of analysis. For research use only." />
    <meta property="og:url" content="https://vsresearchlabs.com/" />
    <meta property="og:image" content="https://vsresearchlabs.com/brand/vs-dna-s-full-colour.png" />
    <meta property="og:image:width" content="480" />
    <meta property="og:image:height" content="480" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="VS Research Labs — Research Peptides & Laboratory Supplies" />
    <meta name="twitter:description" content="Research-grade peptides, laboratory supplies, and precision instruments. For research use only." />
    <meta name="twitter:image" content="https://vsresearchlabs.com/brand/vs-dna-s-full-colour.png" />

    <!-- Structured data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "VS Research Labs",
      "url": "https://vsresearchlabs.com",
      "logo": "https://vsresearchlabs.com/brand/vs-dna-s-full-colour.png",
      "description": "Research-grade peptides, laboratory supplies, and precision instruments. For research use only.",
      "slogan": "Inventory-first. Inquiry-led."
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
