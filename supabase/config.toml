# Supabase CLI config.
#
# Minimal by design: this project is managed from the hosted dashboard, and
# this file exists so that `supabase functions deploy` applies the correct
# per-function JWT settings instead of the CLI default (verify_jwt = ON for
# every function).
#
# NOTE: this does not push auth/db/storage settings — only `supabase config
# push` would do that, and it is not part of the normal deploy flow.

project_id = "ufaajzfuppohbxebftwp"

# mark-payment-claimed is a PUBLIC endpoint: the "I've sent payment" button in
# the invoice email links here with ?t=<lookup_token>. That request carries no
# Supabase JWT, so platform JWT verification must be OFF — the 256-bit
# lookup_token (migration 019) is the authorization. With verify_jwt on, the
# gateway 401s the email click before the function runs, so the payment never
# advances. Keep this false.
[functions.mark-payment-claimed]
verify_jwt = false

# health is a PUBLIC uptime probe: an external monitor (docs/UPTIME.md) sends
# no Supabase JWT, so platform JWT verification must be OFF. The function
# exposes nothing but {ok, db, ts}. Keep this false.
[functions.health]
verify_jwt = false

# reconcile is a PUBLIC reconciliation probe hit by the same uptime cron (no
# JWT). Safe public: its repair path is idempotent, corroborated, and money-
# invisible; the response is {ok, clean, repaired, ts} with no ids/amounts.
# Keep this false.
[functions.reconcile]
verify_jwt = false

# member-automations is invoked by a scheduled GitHub workflow
# (.github/workflows/member-automations.yml) that sends no Supabase JWT, so
# platform JWT verification must be OFF. Unlike reconcile this function CAN
# email customers, so it is NOT safe-public by design — it carries its own
# MANDATORY shared-secret gate (x-automations-secret must match the
# AUTOMATIONS_CRON_SECRET secret; unset → 503 fail-closed, never a send).
# Keep this false.
[functions.member-automations]
verify_jwt = false
