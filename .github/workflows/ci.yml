# CI — lint, typecheck (frontend + edge functions), unit tests, build on every
# push/PR.
#
# Two typecheckers, because this repo has two runtimes:
#   • `tsc -b`      — the Vite app (tsconfig.app.json), vite.config.ts
#     (tsconfig.node.json), and tests/ (tests/tsconfig.json, which also pins
#     place-order/priceCheck.ts — the one Deno-free money-path module).
#   • `deno check`  — supabase/functions/. These are Deno: Deno globals and
#     https:/npm: imports, which tsc cannot resolve. Without this step the
#     1,452-line place-order/index.ts that moves all the money is typechecked
#     by nothing at all.
# A directory argument is used rather than a `**` glob on purpose: bash runs
# without globstar, so `supabase/functions/**/*.ts` silently collapses to one
# level. `deno check <dir>` walks the tree itself.
#
# The e2e job runs the Playwright suite (tests/e2e) against the dev server in
# backend-not-configured mode: fully offline and deterministic (formula
# pricing, external gates route-aborted), asserting the actual checkout money
# numbers. Kept as its own job so the browser install doesn't slow `checks`.
#
# The integration job runs the real-database tier: `supabase start` on the
# runner (ubuntu-latest ships Docker) applies every migration to a fresh local
# Postgres, then tests/integration (money-path RPCs) and tests/rls (RLS
# isolation) run against it via the TEST_SUPABASE_* env vars. Those suites
# self-skip without that env, so inside the `checks` job they remain a no-op
# by design — only this job provides the stack. See docs/INTEGRATION_TESTS.md.
#
# Deliberately excluded:
#   • Deploys — ALL deploys are manual (wrangler / supabase CLI); git push
#     deploys nothing. See README and docs/ROLLBACK.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only reads the repo. It never needs to write
# contents, packages, or deployments.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      # Third-party action, so pinned by commit SHA rather than a mutable tag
      # (v2.0.5). The actions/* steps above are GitHub-maintained and stay on
      # tags. Bump deliberately.
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.x
      - run: npm ci
      # Hard gates — must pass to merge.
      - run: npx tsc -b
      # DENO_NO_PACKAGE_JSON: keep Deno out of the repo's package.json/node_modules.
      # supabase-js@2.110.2 on jsr declares npm: deps (realtime-js) that Deno
      # otherwise tries — and fails — to resolve from the Vite app's node_modules.
      # The edge runtime resolves them natively at deploy; this only affects check.
      - run: deno check supabase/functions/
        env:
          DENO_NO_PACKAGE_JSON: "1"
      # Coverage is a hard gate too: vitest.config.ts holds ratchet thresholds
      # (set at the measured floor, raised as coverage grows toward the 80%
      # bar) — the run fails on regression, so coverage is now enforceable,
      # not just measurable.
      - run: npm run test:coverage
      # Lint is a hard gate: zero errors enforced. React-Compiler-hazard rules
      # (set-state-in-effect, refs, etc.) run as warnings — visible but not
      # blocking, since this project doesn't run React Compiler.
      - run: npm run lint
      # Build last: slowest, and a green bundle is only meaningful once the
      # cheaper gates pass. The build now runs WITH the production frontend
      # env (all three values are bundle-public by design — they are baked
      # into every shipped artifact; see .env.example). Two reasons:
      #   1. scripts/viteEnvGuard.ts hard-fails any build missing a required
      #      VITE_* var or emitting a "[Set …]" placeholder (the 2026-07-17/18
      #      auto-build-lane incident class) — CI exercises that gate on the
      #      real contract.
      #   2. The CI artifact becomes byte-reproducible against a canonical
      #      repo-root build, so provenance checks can compare hashes.
      # CI still never deploys this artifact.
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://ufaajzfuppohbxebftwp.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_OZqMGcP7YYh-SSdMn4iOQA_ttecPFiQ
          VITE_ZELLE_HANDLE: info@velariss.co

  # E2E suite (tests/e2e) — hard gate like `checks`. The dev server gets the
  # same bundle-public env as the build job so the app runs in its real
  # configured mode (the portal-smoke flip card requires it). Determinism is
  # enforced at the spec level: the checkout journey route-aborts
  # Turnstile/REST/functions traffic (forcing offline formula pricing) and
  # asserts hard-coded dollar amounts (unit/line/subtotal/shipping/total);
  # portal-smoke is logged-out, read-only renders.
  e2e:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://ufaajzfuppohbxebftwp.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_OZqMGcP7YYh-SSdMn4iOQA_ttecPFiQ
      VITE_ZELLE_HANDLE: info@velariss.co
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  # Real-database tier — hard gate like `checks`. `supabase start` boots the
  # full local stack in Docker (available on ubuntu-latest) and applies every
  # migration in supabase/migrations/ to a fresh Postgres; the money-path
  # integration suites (tests/integration) and the RLS isolation suites
  # (tests/rls) then run against it through PostgREST with real anon /
  # authenticated / service-role credentials. No coverage flags: coverage is
  # the `checks` job's ratchet; this job proves DB semantics (constraints,
  # atomicity, RLS, grants) that mocks cannot. Enable locally with Docker +
  # `supabase start`; see docs/INTEGRATION_TESTS.md.
  integration:
    runs-on: ubuntu-latest
    # `supabase start` pulls ~10 container images on a cold runner; the suites
    # themselves take ~1 minute. Generous cap so an image-registry slow day
    # fails loudly at the pull, not silently at a stingy timeout.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Third-party action, so pinned by commit SHA rather than a mutable tag
      # (v3.0.0), matching the denoland pin above. The CLI itself is pinned
      # too: supabase start behavior (service set, status output) must not
      # drift under this job's feet. Bump both deliberately.
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520
        with:
          version: 2.109.1
      # Plain `supabase start` — no -x service exclusions. The tests need db +
      # auth + rest + the gateway; excluding the rest would save ~a minute but
      # ties this job to the pinned CLI's internal service names. Reliability
      # beats speed here.
      #
      # HOSTED-PARITY BOOTSTRAP: the production project (created 2025) has the
      # hosted platform's legacy default privileges — every new table/function/
      # sequence in public is granted to anon/authenticated/service_role at
      # creation, and the migrations' explicit `revoke` statements carve
      # security back from that baseline. The pinned CLI's local image ships
      # WITHOUT those defaults (probed 2026-07-18: even service_role got
      # `permission denied for table orders`), which would make the suites
      # test a stricter world than prod. So: boot the stack with migrations
      # stashed, install the same default privileges hosted had from project
      # creation, then apply the migrations on top — same order as prod lived.
      - name: Start stack, install hosted default privileges, apply migrations
        run: |
          mv supabase/migrations /tmp/vsr-migrations
          mkdir supabase/migrations
          supabase start
          eval "$(supabase status -o env)"
          psql "$DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
            grant usage on schema public to anon, authenticated, service_role;
            alter default privileges for role postgres in schema public
              grant all on tables to anon, authenticated, service_role;
            alter default privileges for role postgres in schema public
              grant all on functions to anon, authenticated, service_role;
            alter default privileges for role postgres in schema public
              grant all on sequences to anon, authenticated, service_role;
          SQL
          rmdir supabase/migrations
          mv /tmp/vsr-migrations supabase/migrations
          supabase migration up
      # `supabase status -o env` emits KEY="value" lines (API_URL, ANON_KEY,
      # SERVICE_ROLE_KEY, …). eval them, then fail loudly if any expected key
      # is missing — a CLI that renamed its keys should break THIS step, not
      # let the suites silently self-skip and go green. PUBLISHABLE_KEY /
      # SECRET_KEY are the newer CLI names, accepted as fallbacks.
      - name: Export TEST_SUPABASE_* from the local stack
        run: |
          eval "$(supabase status -o env)"
          TEST_URL="${API_URL:-}"
          TEST_ANON="${ANON_KEY:-${PUBLISHABLE_KEY:-}}"
          TEST_SERVICE="${SERVICE_ROLE_KEY:-${SECRET_KEY:-}}"
          : "${TEST_URL:?supabase status did not report API_URL}"
          : "${TEST_ANON:?supabase status did not report ANON_KEY/PUBLISHABLE_KEY}"
          : "${TEST_SERVICE:?supabase status did not report SERVICE_ROLE_KEY/SECRET_KEY}"
          {
            echo "TEST_SUPABASE_URL=$TEST_URL"
            echo "TEST_SUPABASE_ANON_KEY=$TEST_ANON"
            echo "TEST_SUPABASE_SERVICE_ROLE_KEY=$TEST_SERVICE"
          } >> "$GITHUB_ENV"
      # The :? guards above are what keep this from becoming an expensive
      # always-green no-op: if the env derivation had failed, the job dies
      # there instead of letting the suites silently self-skip here.
      - run: npx vitest run tests/integration tests/rls
      # Generated-types drift gate: regenerate `src/types/supabase.ts` from
      # THIS job's local stack (already booted above, migrations already
      # applied) and diff against the committed file. Deliberately NOT
      # `supabase gen types --linked/--project-id`: that would need a
      # SUPABASE_ACCESS_TOKEN secret (unavailable to forked-repo PRs) and
      # would compare against whatever is deployed, which can legitimately
      # differ from this branch. Generating from the local stack instead
      # proves the committed types match the migrations IN THE REPO — the
      # actual drift this gate exists to catch.
      - name: Check generated DB types are up to date
        run: |
          supabase gen types typescript --local > /tmp/supabase-types-generated.ts
          if ! diff -u src/types/supabase.ts /tmp/supabase-types-generated.ts; then
            echo "::error::src/types/supabase.ts is stale — it no longer matches the schema produced by supabase/migrations/. Run 'supabase start' then 'npm run gen:types' locally, commit the result, and push again."
            exit 1
          fi
