<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="VS Research Labs">
  <title>VS Research Labs</title>
  <!-- Cream tile so the mark reads on both light and dark browser tabs -->
  <rect x="2" y="2" width="96" height="96" rx="20" fill="#F4EFE6"/>
  <rect x="2.5" y="2.5" width="95" height="95" rx="19.5" fill="none" stroke="#1A1714" stroke-opacity="0.08" stroke-width="1"/>
  <!-- Gold double ring (monogram crest) -->
  <circle cx="50" cy="50" r="40" fill="none" stroke="#B5904B" stroke-width="1.4"/>
  <circle cx="50" cy="50" r="37.6" fill="none" stroke="#B5904B" stroke-width="0.5"/>
  <defs>
    <radialGradient id="fGold" cx="0.36" cy="0.30" r="0.85"><stop offset="0" stop-color="#E6CD92"/><stop offset="1" stop-color="#8C6A2A"/></radialGradient>
    <radialGradient id="fTeal" cx="0.36" cy="0.30" r="0.9"><stop offset="0" stop-color="#62A0A6"/><stop offset="1" stop-color="#1E444A"/></radialGradient>
    <radialGradient id="fInk" cx="0.36" cy="0.30" r="0.9"><stop offset="0" stop-color="#4C443A"/><stop offset="1" stop-color="#131110"/></radialGradient>
  </defs>
  <!-- Three bodies behind the VS -->
  <g transform="translate(8.2,9.8) scale(0.82)">
    <g fill="none" stroke="#1A1714" stroke-linecap="round">
      <ellipse cx="50" cy="52" rx="36" ry="21.5" transform="rotate(-20 50 52)" opacity="0.30" stroke-width="0.8"/>
      <ellipse cx="53" cy="47" rx="25" ry="38" transform="rotate(33 53 47)" opacity="0.17" stroke-width="0.7"/>
    </g>
    <circle cx="59" cy="14" r="3.1" fill="url(#fInk)" opacity="0.6"/>
    <circle cx="25" cy="63" r="4.7" fill="url(#fTeal)"/>
    <circle cx="82" cy="43" r="7" fill="url(#fGold)"/>
  </g>
  <text x="50" y="50" font-family="'Cormorant Garamond','Times New Roman',Georgia,serif" font-weight="600" font-size="35" letter-spacing="0.5" fill="#1A1714" text-anchor="middle" dominant-baseline="central">VS</text>
</svg>
