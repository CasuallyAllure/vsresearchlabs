<svg xmlns="http://www.w3.org/2000/svg" width="320" height="104" viewBox="0 0 320 104" fill="none">
  <!-- VS Research Labs — document stamp. Dark ink for white invoices/PDF.
       For the live app's version, use src/components/brand/BrandStamp.tsx.
       To use in email: rasterize this to PNG and host it, then reference by URL. -->
  <g style="color:#1A1714">
    <rect x="3" y="3" width="314" height="98" rx="8" stroke="#1A1714" stroke-opacity="0.45" stroke-width="1.25"/>
    <rect x="8" y="8" width="304" height="88" rx="5" stroke="#1A1714" stroke-opacity="0.22" stroke-width="0.75"/>

    <g stroke="#1A1714" stroke-opacity="0.4" stroke-width="1">
      <line x1="14" y1="16" x2="21" y2="16"/><line x1="14" y1="11" x2="14" y2="21"/>
      <line x1="306" y1="16" x2="299" y2="16"/><line x1="306" y1="11" x2="306" y2="21"/>
      <line x1="14" y1="88" x2="21" y2="88"/><line x1="14" y1="83" x2="14" y2="93"/>
      <line x1="306" y1="88" x2="299" y2="88"/><line x1="306" y1="83" x2="306" y2="93"/>
    </g>

    <text x="160" y="26" text-anchor="middle" fill="#1A1714" fill-opacity="0.5"
      font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="6.5"
      letter-spacing="3" style="text-transform:uppercase">Research-Grade · Bay Area · California</text>

    <text x="150" y="57" text-anchor="middle" fill="#1A1714"
      font-family="'Cormorant Garamond', 'Times New Roman', Georgia, serif" font-size="25" font-weight="600"
      letter-spacing="2" style="text-transform:uppercase">VS Research Labs</text>

    <!-- Three bodies — the single accent -->
    <g transform="translate(262, 40) scale(0.24)">
      <g fill="none" stroke="#1A1714" stroke-opacity="0.4" stroke-linecap="round">
        <ellipse cx="50" cy="52" rx="36" ry="21.5" transform="rotate(-20 50 52)" stroke-width="2.6"/>
        <ellipse cx="53" cy="47" rx="25" ry="38" transform="rotate(33 53 47)" stroke-width="2.2"/>
      </g>
      <circle cx="59" cy="14" r="3.1" fill="#1A1714" fill-opacity="0.55"/>
      <circle cx="25" cy="63" r="4.7" fill="#34727A"/>
      <circle cx="82" cy="43" r="7" fill="#B5904B"/>
    </g>

    <line x1="70" y1="68" x2="250" y2="68" stroke="#1A1714" stroke-opacity="0.25" stroke-width="0.75"/>

    <text x="160" y="82" text-anchor="middle" fill="#1A1714" fill-opacity="0.62"
      font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="6.5"
      letter-spacing="2.4" style="text-transform:uppercase">BioPeptide Sciences · Nootropics · Skin-Care</text>

    <text x="160" y="93.5" text-anchor="middle" fill="#1A1714" fill-opacity="0.4"
      font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="5.5"
      letter-spacing="2.2" style="text-transform:uppercase">For Research Use Only · Not For Human Consumption</text>
  </g>
</svg>
