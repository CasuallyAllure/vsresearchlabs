<svg xmlns="http://www.w3.org/2000/svg" width="320" height="104" viewBox="0 0 320 104" fill="none">
  <!-- VS Research Labs — document stamp. Dark ink for white invoices/PDF.
       For the live app's themeable version, use src/components/brand/BrandStamp.tsx.
       To use in email: rasterize this to PNG and host it, then reference by URL. -->
  <g style="color:#11151b">
    <rect x="3" y="3" width="314" height="98" rx="8" stroke="#11151b" stroke-opacity="0.55" stroke-width="1.25"/>
    <rect x="8" y="8" width="304" height="88" rx="5" stroke="#11151b" stroke-opacity="0.28" stroke-width="0.75"/>

    <g stroke="#11151b" stroke-opacity="0.5" stroke-width="1">
      <line x1="14" y1="16" x2="21" y2="16"/><line x1="14" y1="11" x2="14" y2="21"/>
      <line x1="306" y1="16" x2="299" y2="16"/><line x1="306" y1="11" x2="306" y2="21"/>
      <line x1="14" y1="88" x2="21" y2="88"/><line x1="14" y1="83" x2="14" y2="93"/>
      <line x1="306" y1="88" x2="299" y2="88"/><line x1="306" y1="83" x2="306" y2="93"/>
    </g>

    <text x="160" y="26" text-anchor="middle" fill="#11151b" fill-opacity="0.55"
      font-family="'JetBrains Mono', ui-monospace, monospace" font-size="6.5"
      letter-spacing="3" style="text-transform:uppercase">Research-Grade · Bay Area · California</text>

    <text x="150" y="56" text-anchor="middle" fill="#11151b"
      font-family="Inter, system-ui, -apple-system, sans-serif" font-size="22" font-weight="700"
      letter-spacing="1.5" style="text-transform:uppercase">VS Research Labs</text>

    <g transform="translate(268, 42)" stroke-linecap="round" stroke-width="2.4">
      <line x1="0" y1="16" x2="6" y2="2" stroke="#1FA8D8"/>
      <line x1="7" y1="16" x2="13" y2="2" stroke="#2E6FB0"/>
      <line x1="14" y1="16" x2="20" y2="2" stroke="#E06A12"/>
    </g>

    <line x1="70" y1="68" x2="250" y2="68" stroke="#11151b" stroke-opacity="0.3" stroke-width="0.75"/>

    <text x="160" y="82" text-anchor="middle" fill="#11151b" fill-opacity="0.7"
      font-family="'JetBrains Mono', ui-monospace, monospace" font-size="6.5"
      letter-spacing="2.4" style="text-transform:uppercase">BioPeptide Sciences · Nootropics · Skin-Care</text>

    <text x="160" y="93.5" text-anchor="middle" fill="#11151b" fill-opacity="0.45"
      font-family="'JetBrains Mono', ui-monospace, monospace" font-size="5.5"
      letter-spacing="2.2" style="text-transform:uppercase">For Research Use Only · Not For Human Consumption</text>
  </g>
</svg>
