  <text x="396" y="533" font-family="monospace" font-size="7" fill="rgba(255,255,255,0.18)" letter-spacing="1" text-anchor="end">REV. A</text>
  <text x="396" y="547" font-family="monospace" font-size="7" fill="rgba(255,255,255,0.12)" letter-spacing="1" text-anchor="end">STERILE / QC-004</text>
