  <line x1="24" y1="464" x2="396" y2="464" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <rect x="24" y="472" width="160" height="28" rx="1" fill="rgba(255,255,255,0.015)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
