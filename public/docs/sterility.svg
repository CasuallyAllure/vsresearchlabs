  <text x="24" y="50" font-family="monospace" font-size="12" font-weight="500" fill="rgba(255,255,255,0.88)" letter-spacing="1">STERILITY</text>
  <text x="24" y="64" font-family="monospace" font-size="12" font-weight="500" fill="rgba(255,255,255,0.88)" letter-spacing="1">CERTIFICATE</text>
