  <text x="36" y="342" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.4)" letter-spacing="0.5">Aerobic bacteria</text>
  <text x="300" y="342" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.55)" letter-spacing="0.5">NO GROWTH</text>
  <line x1="36" y1="348" x2="384" y2="348" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <text x="36" y="362" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.4)" letter-spacing="0.5">Anaerobic bacteria</text>
  <text x="300" y="362" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.55)" letter-spacing="0.5">NO GROWTH</text>

