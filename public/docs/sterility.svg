  <text x="248" y="486" font-family="monospace" font-size="7" fill="rgba(255,255,255,0.25)" letter-spacing="1">DATE ISSUED</text>
  <text x="248" y="498" font-family="monospace" font-size="7" fill="rgba(255,255,255,0.18)" letter-spacing="1">2026-04-05</text>

