  <text x="180" y="138" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.55)" letter-spacing="1">BAC-2026-204</text>
  <text x="36" y="152" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.28)" letter-spacing="1">Method</text>
  <text x="180" y="152" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.5)" letter-spacing="1">USP &lt;71&gt; Sterility Test</text>

