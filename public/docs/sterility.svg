  <text x="210" y="396" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.35)" letter-spacing="2" text-anchor="middle">OVERALL RESULT</text>
  <text x="210" y="410" font-family="monospace" font-size="10" fill="rgba(255,255,255,0.72)" letter-spacing="4" text-anchor="middle">STERILE</text>

  <!-- Additional compliance note -->
  <text x="32" y="434" font-family="monospace" font-size="7" fill="rgba(255,255,255,0.25)" letter-spacing="0.5">Preservative: 0.9% benzyl alcohol inhibits bacterial growth</text>
  <text x="32" y="448" font-family="monospace" font-size="7" fill="rgba(255,255,255,0.25)" letter-spacing="0.5">in multi-dose configuration per standard laboratory protocol.</text>

