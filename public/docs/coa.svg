  <rect x="236" y="428" width="160" height="36" rx="1" fill="rgba(255,255,255,0.015)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <text x="248" y="442" font-family="monospace" font-size="7" fill="rgba(255,255,255,0.25)" letter-spacing="1">DATE ISSUED</text>
  <text x="248" y="456" font-family="monospace" font-size="7" fill="rgba(255,255,255,0.18)" letter-spacing="1">2026-04-12</text>

