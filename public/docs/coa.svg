  <text x="32" y="370" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.4)" letter-spacing="0.5">Temperature</text>
  <text x="200" y="370" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.5)" letter-spacing="0.5">−20°C · desiccated</text>
  <text x="32" y="384" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.4)" letter-spacing="0.5">Stability</text>
  <text x="200" y="384" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.5)" letter-spacing="0.5">24 months sealed</text>

