  <text x="32" y="280" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.5)" letter-spacing="0.5">Water content</text>
  <text x="200" y="280" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.32)" letter-spacing="0.5">≤ 8.0%</text>
  <text x="340" y="280" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.55)" letter-spacing="0.5">5.2%</text>
  <line x1="24" y1="286" x2="396" y2="286" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>

  <text x="32" y="300" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.5)" letter-spacing="0.5">Single impurity</text>
  <text x="200" y="300" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.32)" letter-spacing="0.5">≤ 0.5%</text>
  <text x="340" y="300" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.55)" letter-spacing="0.5">0.2%</text>
  <line x1="24" y1="306" x2="396" y2="306" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>

  <text x="32" y="320" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.5)" letter-spacing="0.5">Total impurities</text>
  <text x="200" y="320" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.32)" letter-spacing="0.5">≤ 1.0%</text>
  <text x="340" y="320" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.55)" letter-spacing="0.5">0.6%</text>
  <line x1="24" y1="326" x2="396" y2="326" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

