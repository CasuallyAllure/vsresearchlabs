  <text x="200" y="240" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.32)" letter-spacing="0.5">≥ 99.0%</text>
  <text x="340" y="240" font-family="monospace" font-size="8" fill="#C4A35A" letter-spacing="0.5" opacity="0.85">99.4%</text>
