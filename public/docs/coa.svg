  <text x="200" y="260" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.32)" letter-spacing="0.5">4113.58 g/mol</text>
  <text x="340" y="260" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.55)" letter-spacing="0.5">CONF.</text>
