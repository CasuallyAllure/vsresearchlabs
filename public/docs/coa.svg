  <rect x="24" y="86" width="372" height="68" rx="2" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="36" y="104" font-family="monospace" font-size="7" fill="rgba(255,255,255,0.35)" letter-spacing="2">SPECIMEN IDENTITY</text>
