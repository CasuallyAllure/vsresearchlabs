  <text x="180" y="138" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.55)" letter-spacing="1">SEM-2026-031</text>
  <text x="36" y="152" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.28)" letter-spacing="1">Issue Date</text>
  <text x="180" y="152" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.55)" letter-spacing="1">2026-04-12</text>

