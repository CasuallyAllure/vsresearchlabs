<svg viewBox="0 0 420 560" xmlns="http://www.w3.org/2000/svg">

  <rect width="420" height="560" fill="#0a0a0a"/>

  <!-- Document header band -->
  <rect x="0" y="0" width="420" height="72" fill="rgba(255,255,255,0.025)"/>
  <line x1="0" y1="72" x2="420" y2="72" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>

  <!-- Organization -->
  <text x="24" y="24" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.5)" letter-spacing="2">VS RESEARCH LABS</text>
  <line x1="24" y1="30" x2="132" y2="30" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <!-- Document type title -->
