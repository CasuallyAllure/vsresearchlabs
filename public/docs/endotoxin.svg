<svg viewBox="0 0 420 560" xmlns="http://www.w3.org/2000/svg">

  <rect width="420" height="560" fill="#0a0a0a"/>

  <rect x="0" y="0" width="420" height="72" fill="rgba(255,255,255,0.025)"/>
  <line x1="0" y1="72" x2="420" y2="72" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>

  <text x="24" y="24" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.5)" letter-spacing="2">VS RESEARCH LABS</text>
  <line x1="24" y1="30" x2="132" y2="30" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="24" y="50" font-family="monospace" font-size="12" font-weight="500" fill="rgba(255,255,255,0.88)" letter-spacing="1">ENDOTOXIN</text>
  <text x="24" y="64" font-family="monospace" font-size="12" font-weight="500" fill="rgba(255,255,255,0.88)" letter-spacing="1">TEST REPORT</text>
  <text x="396" y="24" font-family="monospace" font-size="7" fill="rgba(255,255,255,0.3)" letter-spacing="1" text-anchor="end">LAL</text>
  <text x="396" y="36" font-family="monospace" font-size="7" fill="rgba(255,255,255,0.22)" letter-spacing="1" text-anchor="end">FORM-QC-005</text>

  <!-- Specimen block -->
  <rect x="24" y="86" width="372" height="68" rx="2" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="36" y="104" font-family="monospace" font-size="7" fill="rgba(255,255,255,0.35)" letter-spacing="2">SPECIMEN IDENTITY</text>
  <line x1="36" y1="109" x2="384" y2="109" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="36" y="124" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.28)" letter-spacing="1">Product</text>
  <text x="180" y="124" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.55)" letter-spacing="1">Bacteriostatic Water</text>
  <text x="36" y="138" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.28)" letter-spacing="1">Batch No.</text>
  <text x="180" y="138" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.55)" letter-spacing="1">BAC-2026-204</text>
  <text x="36" y="152" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.28)" letter-spacing="1">Test method</text>
  <text x="180" y="152" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.5)" letter-spacing="1">LAL / Kinetic Turbidimetric</text>

  <!-- Test conditions -->
  <text x="24" y="178" font-family="monospace" font-size="7" fill="rgba(255,255,255,0.35)" letter-spacing="2">TEST CONDITIONS</text>
  <line x1="24" y1="184" x2="396" y2="184" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <text x="32" y="198" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.4)" letter-spacing="0.5">Lysate sensitivity</text>
  <text x="220" y="198" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.5)" letter-spacing="0.5">0.03 EU/mL</text>
  <line x1="24" y1="204" x2="396" y2="204" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>

  <text x="32" y="218" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.4)" letter-spacing="0.5">Sample dilution</text>
  <text x="220" y="218" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.5)" letter-spacing="0.5">1:10 (MVD)</text>
  <line x1="24" y1="224" x2="396" y2="224" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>

  <text x="32" y="238" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.4)" letter-spacing="0.5">Incubation temp.</text>
  <text x="220" y="238" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.5)" letter-spacing="0.5">37°C ± 1°C</text>
  <line x1="24" y1="244" x2="396" y2="244" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>

  <text x="32" y="258" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.4)" letter-spacing="0.5">Read interval</text>
  <text x="220" y="258" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.5)" letter-spacing="0.5">Every 6 minutes</text>
  <line x1="24" y1="264" x2="396" y2="264" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Standard curve block -->
  <text x="24" y="288" font-family="monospace" font-size="7" fill="rgba(255,255,255,0.35)" letter-spacing="2">STANDARD CURVE</text>
  <line x1="24" y1="294" x2="396" y2="294" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>

  <!-- Simple log-scale curve schematic -->
  <rect x="24" y="298" width="372" height="62" fill="rgba(255,255,255,0.01)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <line x1="40" y1="346" x2="384" y2="346" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <line x1="40" y1="304" x2="40" y2="346" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <!-- Standard curve line (log-linear) -->
  <path d="M60 344 L100 338 L140 328 L180 318 L220 308 L260 304 L300 302 L340 301" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" stroke-dasharray="0"/>
  <!-- Data points -->
  <circle cx="60" cy="344" r="2.5" fill="rgba(255,255,255,0)" stroke="rgba(255,255,255,0.35)" stroke-width="1"/>
  <circle cx="140" cy="328" r="2.5" fill="rgba(255,255,255,0)" stroke="rgba(255,255,255,0.35)" stroke-width="1"/>
  <circle cx="220" cy="308" r="2.5" fill="rgba(255,255,255,0)" stroke="rgba(255,255,255,0.35)" stroke-width="1"/>
  <circle cx="300" cy="302" r="2.5" fill="rgba(255,255,255,0)" stroke="rgba(255,255,255,0.35)" stroke-width="1"/>
  <!-- Sample result point -->
  <circle cx="90" cy="342" r="3" fill="#C4A35A" stroke="rgba(255,255,255,0)" stroke-width="0" opacity="0.6"/>
  <text x="42" y="356" font-family="monospace" font-size="6" fill="rgba(255,255,255,0.2)">0.001</text>
  <text x="370" y="356" font-family="monospace" font-size="6" fill="rgba(255,255,255,0.2)" text-anchor="end">100 EU/mL</text>
  <text x="40" y="302" font-family="monospace" font-size="6" fill="rgba(255,255,255,0.2)">Abs</text>

  <!-- Results -->
  <text x="24" y="386" font-family="monospace" font-size="7" fill="rgba(255,255,255,0.35)" letter-spacing="2">TEST RESULTS</text>
  <line x1="24" y1="392" x2="396" y2="392" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <text x="32" y="406" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.4)">Sample endotoxin</text>
  <text x="260" y="406" font-family="monospace" font-size="8" fill="#C4A35A" opacity="0.82">0.01 EU/mL</text>
  <line x1="24" y1="412" x2="396" y2="412" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>

  <text x="32" y="426" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.4)">Specification</text>
  <text x="260" y="426" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.5)">≤ 0.25 EU/mL</text>
  <line x1="24" y1="432" x2="396" y2="432" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>

  <text x="32" y="446" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.4)">Overall result</text>
  <text x="260" y="446" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.65)" letter-spacing="1">PASS</text>
  <line x1="24" y1="452" x2="396" y2="452" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Auth -->
  <rect x="24" y="462" width="160" height="28" rx="1" fill="rgba(255,255,255,0.015)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <text x="36" y="476" font-family="monospace" font-size="7" fill="rgba(255,255,255,0.25)" letter-spacing="1">ANALYST</text>
  <text x="36" y="488" font-family="monospace" font-size="7" fill="rgba(255,255,255,0.18)" letter-spacing="1">QC LAB · VSR</text>

  <rect x="236" y="462" width="160" height="28" rx="1" fill="rgba(255,255,255,0.015)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <text x="248" y="476" font-family="monospace" font-size="7" fill="rgba(255,255,255,0.25)" letter-spacing="1">DATE</text>
  <text x="248" y="488" font-family="monospace" font-size="7" fill="rgba(255,255,255,0.18)" letter-spacing="1">2026-04-05</text>

  <line x1="0" y1="516" x2="420" y2="516" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <rect x="0" y="516" width="420" height="44" fill="rgba(255,255,255,0.01)"/>
  <text x="24" y="533" font-family="monospace" font-size="7" fill="rgba(255,255,255,0.22)" letter-spacing="1">VS RESEARCH LABS</text>
  <text x="24" y="547" font-family="monospace" font-size="7" fill="rgba(255,255,255,0.15)" letter-spacing="0.5">Research procurement instrument</text>
  <text x="396" y="533" font-family="monospace" font-size="7" fill="rgba(255,255,255,0.18)" letter-spacing="1" text-anchor="end">REV. A</text>
  <text x="396" y="547" font-family="monospace" font-size="7" fill="rgba(255,255,255,0.12)" letter-spacing="1" text-anchor="end">LAL / QC-005</text>
</svg>
