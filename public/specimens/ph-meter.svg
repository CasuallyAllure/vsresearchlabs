<svg viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">

  <rect width="800" height="800" fill="#16130F"/>

  <line x1="60" y1="74" x2="740" y2="74" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <text x="60" y="56" font-family="monospace" font-size="9" fill="rgba(255,255,255,0.28)" letter-spacing="3">MEASUREMENT INSTRUMENT · pH METER</text>
  <text x="740" y="56" font-family="monospace" font-size="9" fill="rgba(255,255,255,0.18)" letter-spacing="2" text-anchor="end">SPECIMEN PLATE · VS-LE-004</text>

  <!-- pH Meter front schematic + electrode -->

  <!-- Electrode (right side): long glass body probe -->
  <!-- Electrode cable from meter to probe -->
  <path d="M430 374 Q520 374 520 310 L520 240" fill="none" stroke="rgba(255,255,255,0.32)" stroke-width="1.5"/>

  <!-- Electrode body (glass tube) -->
  <rect x="512" y="170" width="16" height="72" rx="3" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>

  <!-- Glass membrane tip -->
  <path d="M512 242 Q520 256 528 242" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.42)" stroke-width="1.5"/>

  <!-- Reference junction (small rect at electrode lower body) -->
  <rect x="511" y="218" width="18" height="4" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>

  <!-- Electrode cap / BNC connector at top -->
  <rect x="516" y="156" width="8" height="16" rx="2" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <circle cx="520" cy="162" r="4" fill="rgba(255,255,255,0)" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>

  <!-- Electrode stand/holder -->
  <rect x="504" y="280" width="32" height="6" rx="1" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <rect x="516" y="256" width="8" height="26" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>

  <!-- Meter body: x=250..430, y=230..540 -->
  <rect x="250" y="230" width="180" height="310" rx="5" fill="rgba(255,255,255,0.015)" stroke="rgba(255,255,255,0.45)" stroke-width="1.5"/>

  <!-- Top info bar -->
  <rect x="250" y="230" width="180" height="28" rx="5" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0)" stroke-width="0"/>
  <line x1="250" y1="258" x2="430" y2="258" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>

  <!-- Logo plate -->
  <text x="340" y="249" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.3)" letter-spacing="2" text-anchor="middle">pH METER</text>

  <!-- Main display: pH readout -->
  <rect x="266" y="272" width="148" height="68" rx="3" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.28)" stroke-width="1"/>
  <!-- Display primary: pH value -->
  <text x="400" y="296" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.25)" letter-spacing="1" text-anchor="end">pH</text>
  <text x="406" y="314" font-family="monospace" font-size="14" fill="rgba(255,255,255,0.55)" letter-spacing="2" text-anchor="end">7.00</text>

  <!-- Secondary display row: mV + temp -->
  <line x1="266" y1="324" x2="414" y2="324" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="276" y="336" font-family="monospace" font-size="7" fill="rgba(255,255,255,0.28)" letter-spacing="1">0.0 mV</text>
  <text x="340" y="336" font-family="monospace" font-size="7" fill="rgba(255,255,255,0.28)" letter-spacing="1" text-anchor="middle">25.0°C</text>

  <!-- Cal indicator -->
  <text x="406" y="334" font-family="monospace" font-size="7" fill="rgba(255,255,255,0.2)" letter-spacing="1" text-anchor="end">CAL</text>

  <!-- Control keys -->
  <rect x="266" y="354" width="36" height="16" rx="2" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <text x="284" y="365" font-family="monospace" font-size="6" fill="rgba(255,255,255,0.3)" text-anchor="middle">CAL</text>

  <rect x="308" y="354" width="36" height="16" rx="2" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <text x="326" y="365" font-family="monospace" font-size="6" fill="rgba(255,255,255,0.3)" text-anchor="middle">MEAS</text>

  <rect x="350" y="354" width="36" height="16" rx="2" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <text x="368" y="365" font-family="monospace" font-size="6" fill="rgba(255,255,255,0.3)" text-anchor="middle">MEM</text>

  <!-- Navigation keys -->
  <rect x="266" y="378" width="16" height="12" rx="1" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
  <rect x="286" y="378" width="16" height="12" rx="1" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
  <rect x="306" y="378" width="16" height="12" rx="1" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
  <rect x="326" y="378" width="16" height="12" rx="1" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>

  <!-- On/Off -->
  <circle cx="400" cy="384" r="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.22)" stroke-width="1.5"/>
  <line x1="400" y1="377" x2="400" y2="383" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/>
  <path d="M394 380 A8 8 0 1 0 406 380" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>

  <!-- Electrode socket on side of meter -->
  <rect x="428" y="358" width="4" height="16" rx="1" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
  <rect x="428" y="380" width="4" height="12" rx="1" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>

  <!-- Data output port at bottom -->
  <rect x="320" y="524" width="20" height="8" rx="1" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <text x="330" y="521" font-family="monospace" font-size="6" fill="rgba(255,255,255,0.18)" text-anchor="middle">USB</text>

  <!-- Stand/base -->
  <rect x="230" y="538" width="220" height="22" rx="3" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/>

  <!-- Right callouts -->
  <line x1="528" y1="200" x2="596" y2="180" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <circle cx="528" cy="200" r="2" fill="rgba(255,255,255,0.3)"/>
  <text x="600" y="177" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.28)" letter-spacing="1">GLASS ELECTRODE</text>
  <text x="600" y="189" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.18)" letter-spacing="1">COMBINATION TYPE</text>

  <line x1="528" y1="248" x2="596" y2="248" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <circle cx="528" cy="248" r="2" fill="rgba(255,255,255,0.3)"/>
  <text x="600" y="245" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.28)" letter-spacing="1">ATC PROBE</text>
  <text x="600" y="257" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.18)" letter-spacing="1">AUTO TEMP. COMP.</text>

  <!-- Left callouts -->
  <line x1="250" y1="290" x2="186" y2="270" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <circle cx="250" cy="290" r="2" fill="rgba(255,255,255,0.3)"/>
  <text x="60" y="267" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.26)" letter-spacing="1">pH / mV / °C</text>
  <text x="60" y="279" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.18)" letter-spacing="1">SIMULTANEOUS</text>

  <line x1="250" y1="430" x2="186" y2="430" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <circle cx="250" cy="430" r="2" fill="rgba(255,255,255,0.3)"/>
  <text x="60" y="427" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.26)" letter-spacing="1">500 READING</text>
  <text x="60" y="439" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.18)" letter-spacing="1">MEMORY + TIMESTAMP</text>

  <text x="60" y="602" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.16)" letter-spacing="1">RANGE −2.00 TO 16.00 pH · ±0.01 ACCURACY</text>
  <text x="400" y="602" font-family="monospace" font-size="9" fill="#B5904B" letter-spacing="1.5" text-anchor="middle" opacity="0.75">VSR-LE-PHM-001</text>

  <line x1="60" y1="618" x2="740" y2="618" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <text x="60" y="636" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.22)" letter-spacing="2">CAL KIT INCLUDED · pH 4.01 / 7.00 / 10.01</text>
  <text x="740" y="636" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.16)" letter-spacing="1" text-anchor="end">VS RESEARCH LABS</text>
</svg>
