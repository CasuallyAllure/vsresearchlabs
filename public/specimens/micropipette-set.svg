  <path d="M546 442 L538 500 L582 500 L574 442 Z" fill="rgba(255,255,255,0.015)" stroke="rgba(255,255,255,0.38)" stroke-width="1.5"/>
  <path d="M541 500 L549 528 L571 528 L579 500 Z" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.32)" stroke-width="1"/>
  <path d="M550 528 L554 552 L566 552 L570 528 Z" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)" stroke-width="1"/>

