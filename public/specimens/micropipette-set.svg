  <line x1="196" y1="200" x2="134" y2="180" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <circle cx="196" cy="200" r="2" fill="rgba(255,255,255,0.3)"/>
  <text x="60" y="177" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.26)" letter-spacing="1">PLUNGER BUTTON</text>
  <text x="60" y="189" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.18)" letter-spacing="1">AUTOCLAVABLE 121°C</text>

  <line x1="200" y1="350" x2="134" y2="350" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <circle cx="200" cy="350" r="2" fill="rgba(255,255,255,0.3)"/>
  <text x="60" y="347" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.26)" letter-spacing="1">ERGONOMIC</text>
  <text x="60" y="359" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.18)" letter-spacing="1">HOUSING ± 0.8%</text>

  <line x1="60" y1="638" x2="740" y2="638" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <text x="60" y="656" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.22)" letter-spacing="2">SINGLE-CHANNEL · VARIABLE VOLUME · FACTORY CALIBRATED</text>
  <text x="740" y="656" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.16)" letter-spacing="1" text-anchor="end">VS RESEARCH LABS</text>
