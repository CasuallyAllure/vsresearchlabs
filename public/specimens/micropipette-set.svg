  <line x1="369" y1="236" x2="391" y2="236" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>
  <line x1="369" y1="308" x2="391" y2="308" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>
  <text x="380" y="256" font-family="monospace" font-size="7" fill="rgba(255,255,255,0.5)" text-anchor="middle">P100</text>
