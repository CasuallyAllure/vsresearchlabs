  <text x="400" y="598" font-family="monospace" font-size="10" font-weight="500" fill="rgba(255,255,255,0.75)" letter-spacing="2" text-anchor="middle">MICROPIPETTE SET · 3-PIECE</text>
  <text x="400" y="612" font-family="monospace" font-size="9" fill="#B5904B" letter-spacing="1.5" text-anchor="middle" opacity="0.82">VSR-LE-PIP-SET</text>

  <!-- Right callouts -->
  <line x1="578" y1="230" x2="640" y2="200" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <circle cx="578" cy="230" r="2" fill="rgba(255,255,255,0.3)"/>
  <text x="644" y="197" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.28)" letter-spacing="1">INDIVIDUAL</text>
  <text x="644" y="209" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.18)" letter-spacing="1">CAL. CERT.</text>

  <line x1="574" y1="440" x2="640" y2="440" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
