<svg viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">

  <rect width="800" height="800" fill="#16130F"/>

  <line x1="60" y1="74" x2="740" y2="74" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <text x="60" y="56" font-family="monospace" font-size="9" fill="rgba(255,255,255,0.28)" letter-spacing="3">LIQUID HANDLING · MICROPIPETTE SET</text>
  <text x="740" y="56" font-family="monospace" font-size="9" fill="rgba(255,255,255,0.18)" letter-spacing="2" text-anchor="end">SPECIMEN PLATE · VS-LE-005</text>

  <!-- Three pipettes side by side: P10, P100, P1000 -->
