  <rect x="203" y="203" width="14" height="6" rx="1" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <text x="210" y="208" font-family="monospace" font-size="5" fill="rgba(255,255,255,0.4)" text-anchor="middle">10.0</text>
  <!-- Barrel body -->
  <rect x="202" y="212" width="16" height="200" rx="3" fill="rgba(255,255,255,0.015)" stroke="rgba(255,255,255,0.42)" stroke-width="1.5"/>
