  <text x="644" y="437" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.28)" letter-spacing="1">TIP EJECTOR</text>
  <text x="644" y="449" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.18)" letter-spacing="1">STAINLESS CONE</text>

