  <ellipse cx="560" cy="166" rx="18" ry="10" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.38)" stroke-width="1.5"/>
  <rect x="546" y="176" width="28" height="16" rx="2" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.32)" stroke-width="1"/>
  <rect x="550" y="179" width="20" height="10" rx="1" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
