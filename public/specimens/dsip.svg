<svg viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="lyoDots" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="0.9" fill="rgba(255,255,255,0.2)"/></pattern>
    <clipPath id="vialFill"><path d="M333 446 L333 557 Q333 576 400 576 Q467 576 467 557 L467 446 Z"/></clipPath>
    <radialGradient id="bgDepth" cx="0.5" cy="0.46" r="0.62">
      <stop offset="0" stop-color="#0e2a38" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#0a1822" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#0a0a0a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="floorPool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#bfeffd" stop-opacity="0.5"/>
      <stop offset="0.45" stop-color="#5EDDF6" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#5EDDF6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glassBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="0.12" stop-color="#ffffff" stop-opacity="0.085"/>
      <stop offset="0.34" stop-color="#ffffff" stop-opacity="0.015"/>
      <stop offset="0.52" stop-color="#ffffff" stop-opacity="0.008"/>
      <stop offset="0.72" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="0.9" stop-color="#cdeefb" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="spec" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#eafdff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#eafdff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#eafdff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="reflFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cdeefb" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#cdeefb" stop-opacity="0"/>
    </linearGradient>
    <filter id="vglow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="7"/></filter>
  </defs>

  <rect width="800" height="800" fill="#0a0a0a"/>
  <rect width="800" height="800" fill="url(#bgDepth)"/>

  <!-- Header rule + identifiers -->
  <line x1="60" y1="74" x2="740" y2="74" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <text x="60" y="56" font-family="monospace" font-size="9" fill="rgba(255,255,255,0.28)" letter-spacing="3">DELTA SLEEP-INDUCING PEPTIDE</text>
  <text x="740" y="56" font-family="monospace" font-size="9" fill="rgba(255,255,255,0.18)" letter-spacing="2" text-anchor="end">SPECIMEN PLATE · VS-RS-111</text>

  <!-- Depth: perspective floor, backlit halo, contact pool, reflection -->
  <g class="pad"><line x1="332" y1="586" x2="468" y2="586" stroke="#5EDDF6" stroke-opacity="0.22" stroke-width="1"/><line x1="332.0" y1="586" x2="246.0" y2="694" stroke="#5EDDF6" stroke-opacity="0.10" stroke-width="1"/><line x1="354.7" y1="586" x2="297.3" y2="694" stroke="#5EDDF6" stroke-opacity="0.10" stroke-width="1"/><line x1="377.3" y1="586" x2="348.7" y2="694" stroke="#5EDDF6" stroke-opacity="0.10" stroke-width="1"/><line x1="400.0" y1="586" x2="400.0" y2="694" stroke="#5EDDF6" stroke-opacity="0.10" stroke-width="1"/><line x1="422.7" y1="586" x2="451.3" y2="694" stroke="#5EDDF6" stroke-opacity="0.10" stroke-width="1"/><line x1="445.3" y1="586" x2="502.7" y2="694" stroke="#5EDDF6" stroke-opacity="0.10" stroke-width="1"/><line x1="468.0" y1="586" x2="554.0" y2="694" stroke="#5EDDF6" stroke-opacity="0.10" stroke-width="1"/><line x1="318.2" y1="595.1" x2="481.8" y2="595.1" stroke="#5EDDF6" stroke-opacity="0.071" stroke-width="1"/><line x1="301.0" y1="613.2" x2="499.0" y2="613.2" stroke="#5EDDF6" stroke-opacity="0.097" stroke-width="1"/><line x1="280.4" y1="640.2" x2="519.6" y2="640.2" stroke="#5EDDF6" stroke-opacity="0.128" stroke-width="1"/><line x1="258.0" y1="674.1" x2="542.0" y2="674.1" stroke="#5EDDF6" stroke-opacity="0.162" stroke-width="1"/><line x1="246.0" y1="694.0" x2="554.0" y2="694.0" stroke="#5EDDF6" stroke-opacity="0.180" stroke-width="1"/></g>
  <path d="M334 218 L334 557 Q334 577 400 577 Q466 577 466 557 L466 218 Z" fill="#5EDDF6" opacity="0.12" filter="url(#vglow)"/>
  <ellipse cx="400" cy="585" rx="92" ry="16" fill="url(#floorPool)"/>
  <rect x="366" y="560" width="68" height="92" fill="url(#reflFade)"/>

  <!-- Crimp cap button -->
  <rect x="350" y="156" width="100" height="16" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.32)" stroke-width="1"/>

  <!-- Crimp band -->
  <rect x="320" y="172" width="160" height="26" rx="2" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
  <line x1="332" y1="172" x2="332" y2="198" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <line x1="348" y1="172" x2="348" y2="198" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <line x1="364" y1="172" x2="364" y2="198" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <line x1="380" y1="172" x2="380" y2="198" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <line x1="396" y1="172" x2="396" y2="198" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <line x1="412" y1="172" x2="412" y2="198" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <line x1="428" y1="172" x2="428" y2="198" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <line x1="444" y1="172" x2="444" y2="198" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <line x1="460" y1="172" x2="460" y2="198" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

  <!-- Rubber stopper -->
  <rect x="334" y="198" width="132" height="20" rx="1" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.28)" stroke-width="1"/>

  <!-- Vial body — glass-shaded -->
  <path d="M334 218 L334 557 Q334 577 400 577 Q466 577 466 557 L466 218 Z" fill="url(#glassBody)" stroke="rgba(255,255,255,0.52)" stroke-width="1.5"/>
  <!-- Specular highlight on the near glass wall -->
  <rect x="345" y="236" width="11" height="300" rx="5.5" fill="url(#spec)" opacity="0.6"/>
  <!-- Inner glass walls -->
  <line x1="346" y1="220" x2="346" y2="554" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <line x1="454" y1="220" x2="454" y2="554" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Fill line + cake -->
  <line x1="334" y1="446" x2="466" y2="446" stroke="rgba(255,255,255,0.16)" stroke-width="1" stroke-dasharray="4,4"/>
  <rect x="334" y="447" width="132" height="128" fill="url(#lyoDots)" clip-path="url(#vialFill)"/>

  <!-- Label band -->
  <rect x="334" y="284" width="132" height="144" fill="rgba(255,255,255,0.025)"/>
  <line x1="334" y1="284" x2="466" y2="284" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
  <line x1="334" y1="428" x2="466" y2="428" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>

  <!-- Label text -->
  <text x="400" y="306" font-family="monospace" font-size="12" font-weight="500" fill="rgba(255,255,255,0.92)" letter-spacing="2" text-anchor="middle">DSIP</text>
  <line x1="350" y1="315" x2="450" y2="315" stroke="rgba(255,255,255,0.09)" stroke-width="1"/>
  <text x="400" y="332" font-family="monospace" font-size="10" fill="rgba(255,255,255,0.58)" letter-spacing="1" text-anchor="middle">2 – 10 mg / vial</text>
  <text x="400" y="349" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.36)" letter-spacing="1" text-anchor="middle">LYOPHILIZED POWDER</text>
  <line x1="350" y1="359" x2="450" y2="359" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <text x="400" y="374" font-family="monospace" font-size="9" fill="#C4A35A" letter-spacing="1.5" text-anchor="middle" opacity="0.85">VSR-RS-DSIP</text>
  <text x="400" y="390" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.3)" letter-spacing="1" text-anchor="middle">PURITY ≥ 98% HPLC</text>
  <text x="400" y="406" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.26)" letter-spacing="1" text-anchor="middle">STORE −20°C · DESICCATED</text>
  <text x="400" y="421" font-family="monospace" font-size="7" fill="rgba(255,255,255,0.18)" letter-spacing="1" text-anchor="middle">CAS 62568-57-4</text>

  <!-- Right callouts -->
  <line x1="481" y1="185" x2="548" y2="185" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <circle cx="481" cy="185" r="2" fill="rgba(255,255,255,0.3)"/>
  <text x="552" y="182" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.28)" letter-spacing="1">ALUMINIUM CRIMP</text>
  <text x="552" y="193" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.18)" letter-spacing="1">FLIP-OFF CAP</text>

  <line x1="467" y1="208" x2="548" y2="208" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <circle cx="467" cy="208" r="2" fill="rgba(255,255,255,0.3)"/>
  <text x="552" y="212" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.28)" letter-spacing="1">RUBBER STOPPER</text>

  <line x1="467" y1="492" x2="548" y2="492" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <circle cx="467" cy="492" r="2" fill="rgba(255,255,255,0.3)"/>
  <text x="552" y="489" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.28)" letter-spacing="1">LYOPHILIZED</text>
  <text x="552" y="501" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.28)" letter-spacing="1">CAKE</text>

  <!-- Left callouts -->
  <line x1="334" y1="350" x2="256" y2="350" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <circle cx="334" cy="350" r="2" fill="rgba(255,255,255,0.3)"/>
  <text x="60" y="347" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.26)" letter-spacing="1">BOROSILICATE</text>
  <text x="60" y="359" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.26)" letter-spacing="1">GLASS VIAL</text>

  <!-- MW / class block -->
  <text x="60" y="716" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.16)" letter-spacing="1">MW 848.81 g/mol</text>
  <text x="60" y="729" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.14)" letter-spacing="1">NOOTROPIC / NEUROACTIVE</text>

  <!-- Footer -->
  <line x1="60" y1="752" x2="740" y2="752" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <text x="60" y="770" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.22)" letter-spacing="2">FOR RESEARCH PURPOSES ONLY · NOT FOR HUMAN USE</text>
  <text x="740" y="770" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.16)" letter-spacing="1" text-anchor="end">VS RESEARCH LABS</text>
</svg>
