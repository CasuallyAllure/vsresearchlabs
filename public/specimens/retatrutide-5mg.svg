  <text x="552" y="489" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.28)" letter-spacing="1">LYOPHILIZED</text>
  <text x="552" y="501" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.28)" letter-spacing="1">CAKE</text>

  <!-- Left callouts -->
  <line x1="334" y1="350" x2="256" y2="350" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <circle cx="334" cy="350" r="2" fill="rgba(255,255,255,0.3)"/>
  <text x="60" y="347" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.26)" letter-spacing="1">BOROSILICATE</text>
  <text x="60" y="359" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.26)" letter-spacing="1">GLASS · 5 mL</text>

  <text x="60" y="608" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.16)" letter-spacing="1">MW ~4960 g/mol</text>
  <text x="60" y="621" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.14)" letter-spacing="1">TRIPLE GIP/GLP-1/GCG AGONIST</text>

  <line x1="60" y1="638" x2="740" y2="638" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <text x="60" y="656" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.22)" letter-spacing="2">FOR RESEARCH PURPOSES ONLY · NOT FOR HUMAN USE</text>
  <text x="740" y="656" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.16)" letter-spacing="1" text-anchor="end">VS RESEARCH LABS</text>
</svg>
