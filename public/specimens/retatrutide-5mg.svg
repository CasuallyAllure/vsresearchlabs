  <line x1="412" y1="172" x2="412" y2="198" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <line x1="428" y1="172" x2="428" y2="198" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
